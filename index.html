<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DurioSense – Smart Tree Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="layout">

  <div class="dashboard">

    <div class="header">
      <h1>🌳 DurioSense</h1>
      <span>Smart Durian Tree Monitoring</span><br>
      <div class="tree-badge" id="treeType">Loading...</div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="icon">🌡</div>
        <div class="label">Temperature</div>
        <div class="value" id="temp">--</div>
      </div>

      <div class="card">
        <div class="icon">💧</div>
        <div class="label">Humidity</div>
        <div class="value" id="hum">--</div>
      </div>

      <div class="card">
        <div class="icon">🌱</div>
        <div class="label">Soil Moisture</div>
        <div class="value" id="soil">--</div>
      </div>

      <div class="card">
        <div class="icon">🌲</div>
        <div class="label">Tree Circumference</div>
        <div class="value" id="circ">--</div>
      </div>

      <!-- ADDED -->
      <div class="card">
        <div class="icon">📅</div>
        <div class="label">Planting Date</div>
        <div class="value" id="plantingDate">--</div>
      </div>

      <!-- ADDED -->
      <div class="card">
        <div class="icon">⏳</div>
        <div class="label">Tree Age</div>
        <div class="value" id="treeAge">--</div>
      </div>

      <div class="status" id="rain">Checking rain...</div>
    </div>

    <div class="footer">
      Last updated: <span id="time">--</span>
    </div>
  </div>

  <div class="chart-card">
    <h4>🌱 Soil Moisture</h4>
    <canvas id="soilChart"></canvas>
  </div>

  <div class="chart-card">
    <h4>🌲 Tree Circumference</h4>
    <canvas id="circChart"></canvas>
  </div>

</div>

<script src="app.js"></script>

<div id="alertPopup" class="alert-popup">
  <div class="alert-box">
    <h3>⚠ Tree Health Alert</h3>
    <p id="alertMessage"></p>
    <p id="alertAction" class="alert-action"></p>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>

</body>
</html>
