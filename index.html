<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DurioSense – Smart Tree Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="layout">

  <!-- 1: Temperature Chart -->
  <div class="chart-card">
    <h4>🌡 Temperature</h4>
    <canvas id="tempChart"></canvas>
  </div>

  <!-- 5: Monitoring Card -->
  <div class="dashboard">
    <div class="header">
      <h1>🌳 DurioSense</h1>
      <span>Smart Durian Tree Monitoring</span><br>
      <div class="tree-badge" id="treeType">Loading...</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="icon">🌡</div>
        <div class="label">Temperature</div>
        <div class="value" id="temp">--</div>
      </div>

      <div class="card">
        <div class="icon">💧</div>
        <div class="label">Humidity</div>
        <div class="value" id="hum">--</div>
      </div>

      <div class="card">
        <div class="icon">🌱</div>
        <div class="label">Soil Moisture</div>
        <div class="value" id="soil">--</div>
      </div>

      <div class="card">
        <div class="icon">🌲</div>
        <div class="label">Tree Circumference</div>
        <div class="value" id="circ">--</div>
      </div>

      <button class="status rain-btn" id="rain" onclick="toggleRainPopup()">
  Checking rain...
</button>

    <div class="footer">
      Last updated: <span id="time">--</span>
    </div>
  </div>

  <!-- 3: Soil Moisture Chart -->
  <div class="chart-card">
    <h4>🌱 Soil Moisture</h4>
    <canvas id="soilChart"></canvas>
  </div>

  <!-- 2: Humidity Chart -->
  <div class="chart-card">
    <h4>💧 Humidity</h4>
    <canvas id="humChart"></canvas>
  </div>

  <!-- 4: Tree Circumference Chart -->
  <div class="chart-card">
    <h4>🌲 Circumference</h4>
    <canvas id="circChart"></canvas>
  </div>

</div>

<script src="app.js"></script>

<!-- TREE HEALTH ALERT POPUP -->
<div id="alertPopup" class="alert-popup">
  <div class="alert-box">
    <h3>⚠ Tree Health Alert</h3>
    <p id="alertMessage"></p>
    <p id="alertAction" class="alert-action"></p>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>
  
<!-- RAIN TREND POPUP -->
<div id="rainPopup" class="alert-popup">
  <div class="alert-box green">
    <h3>🌧 Rain Trend</h3>
    <canvas id="rainChart" height="200"></canvas>
    <button onclick="toggleRainPopup()">Close</button>
  </div>
</div>

</body>
</html>
